<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ c.siteTitle }}</title>
<meta name="description" content="{{ c.siteTitle }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2322241f'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23b08d57' text-anchor='middle'%3EAN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a class="mark" href="#top" id="brandMark"></a>
    <nav>
      <a href="#about">About</a>
      <a href="#focus">Focus</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="top">
  <div class="wrap">
    <section class="hero">
      <div class="kicker" data-hero="1" id="heroKicker"></div>
      <h1 data-hero="2" id="heroName"></h1>
      <div class="arabic-name" lang="ar" dir="rtl" data-hero="3" id="heroArabic"></div>
      <p class="bio" data-hero="4" id="heroBio"></p>
      <div class="hero-cta" data-hero="5">
        <a class="btn btn-solid" href="#contact" id="heroCta"></a>
        <a class="btn btn-ghost" href="#focus">What I do</a>
      </div>
    </section>
    <hr class="rule">
  </div>

  <section class="block" id="about">
    <div class="wrap">
      <div class="section-head" data-reveal>
        <div class="section-index">01 — About</div>
        <h2 id="aboutTitle"></h2>
      </div>
      <div class="about-grid">
        <div class="about-text" data-reveal="left">
          <p id="aboutP1"></p>
          <p id="aboutP2"></p>
        </div>
        <div class="facts" data-reveal="right" id="factsBox"></div>
      </div>
    </div>
  </section>

  <section class="block alt" id="focus">
    <div class="wrap">
      <div class="section-head" data-reveal>
        <div class="section-index">02 — Focus</div>
        <h2 id="focusTitle"></h2>
      </div>
      <div class="cards" id="cardsGrid" data-reveal></div>
    </div>
  </section>

  <section class="block" id="contact">
    <div class="wrap">
      <div class="contact-panel" data-reveal>
        <h2 id="contactTitle"></h2>
        <p id="contactText"></p>
        <div class="links" id="linksRow"></div>
      </div>
    </div>
  </section>

  <footer>
    <div class="ar" lang="ar" dir="rtl" id="footerAr"></div>
    <div id="footerText"></div>
  </footer>
</main>

<noscript>
  <div style="max-width:640px;margin:80px auto;padding:0 24px;font-family:Georgia,serif;text-align:center;">
    <h1>{{ c.firstName }} {{ c.lastName }}</h1>
    <p>{{ c.bio }}</p>
  </div>
</noscript>

<script>
  window.SITE_CONTENT = {{ c | tojson }};
</script>
<script src="/static/main.js"></script>
</body>
</html>
