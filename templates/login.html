<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Tajawal", sans-serif; background: #f7f4ee; color: #22241f;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .box {
    background: #fffdf9; border: 1px solid rgba(34,36,31,0.12); border-radius: 16px;
    padding: 44px 38px; width: 100%; max-width: 400px;
    box-shadow: 0 30px 60px -45px rgba(34,36,31,0.4);
  }
  h1 { font-size: 1.4rem; margin-bottom: 8px; }
  p.sub { color: #6b675c; font-size: 0.92rem; margin-bottom: 28px; }
  label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; }
  input {
    width: 100%; padding: 13px 16px; border: 1px solid rgba(34,36,31,0.2); border-radius: 10px;
    font-family: inherit; font-size: 1rem; background: #fff; margin-bottom: 18px;
  }
  input:focus { outline: 2px solid rgba(154,116,52,0.4); border-color: #9a7434; }
  button {
    width: 100%; padding: 14px; border: none; border-radius: 10px; cursor: pointer;
    background: #22241f; color: #f7f4ee; font-family: inherit; font-size: 1rem; font-weight: 500;
    transition: background 0.3s ease;
  }
  button:hover { background: #9a7434; }
  .err {
    background: rgba(180, 60, 50, 0.1); color: #a03428; border: 1px solid rgba(180,60,50,0.3);
    border-radius: 10px; padding: 11px 14px; font-size: 0.88rem; margin-bottom: 18px;
  }
  a.back { display: block; text-align: center; margin-top: 20px; color: #6b675c; font-size: 0.85rem; text-decoration: none; }
  a.back:hover { color: #9a7434; }
</style>
</head>
<body>
  <form class="box" method="post" action="/admin/login">
    <h1>لوحة التحكم</h1>
    <p class="sub">سجّل الدخول حتى تعدّل محتوى موقعك.</p>
    {% if error %}
    <div class="err">كلمة المرور غير صحيحة، حاول مرة ثانية.</div>
    {% endif %}
    <label for="password">كلمة المرور</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
    <button type="submit">دخول</button>
    <a class="back" href="/">← رجوع للموقع</a>
  </form>
</body>
</html>
